<h1 class="cart-header">KOSÁR</h1>
<hr class="hr-top">

@if (isLoading){
  <div class="spinner-container">
    <mat-spinner></mat-spinner>
  </div>
}@else {
  <div class="table-container">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Termék </th>
        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Ár </th>
        <td mat-cell *matCellDef="let element"> {{element.price}}€ </td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> Mennyiség </th>
        <td mat-cell *matCellDef="let element">
          <div class="quantity-elements">
            <div>
              <button matFab class="decrease-button" (click)="decreaseQuantity(element.id)">
                <mat-icon>remove</mat-icon>
              </button>
            </div>
            <div>
              {{element.quantity}}db
            </div>
            <div>
              <button matFab class="increase-button" (click)="increaseQuantity(element.id)">
                <mat-icon class="increase-icon">add</mat-icon>
              </button>
            </div>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="totalPrice">
        <th mat-header-cell *matHeaderCellDef> Összesen </th>
        <td mat-cell *matCellDef="let element"> {{element.totalPrice}}€ </td>
      </ng-container>

      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let element">
          <button matFab class="remove-button" (click)="removeItem(element.id)">
            <mat-icon class="remove-icon">close</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="cart-footer">
    <div class="order-summary">
      <p class="summary-p">Végösszeg : {{overallPrice}}€</p>
    </div>
    <div class="order-buttons">
      <button mat-flat-button [routerLink]="['/order']">Vissza</button>
      <button mat-flat-button (click)="openOrderModal()">Rendelés véglegesítése</button>
    </div>
  </div>
}
