<div class="container">
  <div class="image">
    <img [src]="'data:image/jpeg;base64,' + pizzaDetail.pizzaImageBytes" />
  </div>
  <div class="text">
    <h3>{{pizzaDetail.pizzaName}}</h3>
    <p [matTooltip]="pizzaDetail.description">{{truncatedText}}</p>
    <button mat-flat-button (click)="onAddToCart()">Hozzáadás</button>
  </div>
</div>
